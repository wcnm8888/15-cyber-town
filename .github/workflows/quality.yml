name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.6.14"
          enable-cache: false

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked development environment
        run: uv sync --locked --all-groups

      - name: Install pinned Godot
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          archive="${RUNNER_TEMP}/godot.zip"
          install_dir="${RUNNER_TEMP}/godot"
          curl --fail --location --retry 3 --output "${archive}" "${GODOT_URL}"
          echo "${GODOT_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          chmod +x "${install_dir}/Godot_v4.7.2-stable_linux.x86_64"
          echo "CYBER_TOWN_GODOT=${install_dir}/Godot_v4.7.2-stable_linux.x86_64" >> "${GITHUB_ENV}"

      - name: Run unified quality gate
        run: uv run --frozen python scripts/quality.py
